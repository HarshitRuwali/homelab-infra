site_name: S3 Backup Automation
site_description: >-
  Nightly off-site backup of Immich and Nextcloud to Amazon S3. restic for the
  databases and Nextcloud files, rclone for the photo originals, restores
  drilled monthly.
site_author: Harshit Ruwali

# Required for a correct sitemap.xml and canonical <link> tags. GitHub Pages
# serves a project repo under /<repo>/, and this site is published into a
# subdirectory of it, so the trailing path matters: without
# it every canonical URL points at the domain root and the sitemap is wrong.
# Change this if you move the site behind your own domain.
site_url: https://harshitruwali.github.io/homelab-infra/s3-backup/

repo_url: https://github.com/HarshitRuwali/homelab-infra
repo_name: HarshitRuwali/homelab-infra
edit_uri: edit/master/s3-backup/docs/

# Serve locally without installing anything globally, from this directory:
#   uvx --with mkdocs-material mkdocs serve
# Build a static site into ./site:
#   uvx --with mkdocs-material mkdocs build
#
# Pinned deps live in docs/requirements.txt for CI.

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys

plugins:
  - search

# Themes Mermaid diagrams to the indigo palette in both colour schemes. This
# file is byte-identical across memory/, monitoring/ and s3-backup/.
extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HarshitRuwali/homelab-infra

# Flat, unlike the sibling sites: seven pages read end to end in this order,
# and grouping them would add a click without adding a distinction.
nav:
  - Home: index.md
  - Setup: setup.md
  - Secrets: secrets.md
  - Architecture: architecture.md
  - Restore: restore.md
  - Operations: operations.md
  - Costs: costs.md
  - Building the docs: tooling.md

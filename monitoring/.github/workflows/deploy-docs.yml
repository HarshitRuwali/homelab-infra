name: Deploy docs

# Builds the MkDocs site and publishes it to GitHub Pages.
#
# Docs only: it never runs a playbook, never connects to a host, and uses no
# repository secret. Nothing here can reach the fleet.
#
# PREREQUISITE, one time, cannot be automated:
#   Settings -> Pages -> Source: GitHub Actions
# Creating a Pages site is an admin-level API call and GITHUB_TOKEN cannot make
# it, regardless of the `pages: write` permission below. `configure-pages` with
# `enablement: true` does not work around this either: the create call comes
# back "Resource not accessible by integration". Only a PAT would do it, and
# this workflow deliberately uses no secret. Until the setting is flipped by
# hand, `build` fails at "Configure GitHub Pages" with "Get Pages site failed".

on:
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/deploy-docs.yml
  push:
    branches:
      - master
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      # --strict turns broken internal links and pages missing from the nav
      # into build failures rather than warnings nobody reads.
      - name: Build docs
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4

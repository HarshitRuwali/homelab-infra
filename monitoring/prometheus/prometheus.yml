global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

# Collectors can replay queued samples after a brief ingest outage. The window
# would also hide two hosts sending identical series, so
# fleet-prometheus-out-of-order alerts when out-of-order samples keep arriving.
storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Loki and Grafana expose /metrics. The histogram buckets are dropped: no
  # dashboard or alert charts them, and they are most of the series count.
  - job_name: loki
    static_configs:
      - targets:
          - loki:3100
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.+_bucket'
        action: drop

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.+_bucket'
        action: drop

apiVersion: 1

# `host` is promoted to a first-class field because every metric and log line
# in this fleet carries it via Alloy's external_labels. An alert that does not
# say which machine it is about is close to useless.
#
# MARKDOWN IS NOT OPTIONAL HERE. The relay is the `matrix-webhook` PyPI package,
# which runs this message body through Python-Markdown and sends the result as
# `formatted_body`. Two consequences, both load-bearing below:
#
#   1. `.SilenceURL` contains `__alert_rule_uid__`, and `__x__` is markdown for
#      bold. Emitted bare, it renders as <strong>alert_rule_uid</strong> and the
#      four underscores are eaten, so the link pre-fills a silence with a
#      matcher on a label that does not exist. The silence then shows Active,
#      "Alert rule targeted: None", and silences nothing. Wrapping it in <>
#      makes it an autolink, whose contents markdown leaves alone.
#   2. Runbooks contain placeholders like <name>, <device> and <unit>. Bare,
#      markdown passes them through as raw HTML tags and the Matrix client drops
#      them, so `journalctl -u <unit>` arrives as `journalctl -u`. A code span
#      escapes them and renders the command as monospace, which it should be.
#      No annotation currently contains a backtick; keep it that way.
templates:
  - orgId: 1
    name: fleet.message
    template: |
      {{ define "fleet.message" }}
      Status: {{ .Status }} | Severity: {{ .CommonLabels.severity }}
      {{ range .Alerts }}
      * {{ .Labels.alertname }} on {{ .Labels.host }}{{ with .Labels.mountpoint }} (mount {{ . }}){{ end }}{{ with .Labels.name }} (unit {{ . }}){{ end }}
        {{ .Annotations.summary }}
        value: {{ range $ref, $v := .Values }}{{ $ref }}={{ $v }} {{ end }}
        {{ with .Annotations.runbook }}fix: `{{ . }}`
        {{ end }}{{ with .SilenceURL }}silence: <{{ . }}>{{ end }}
      {{ end }}
      {{ end }}

  # One message per signature (policies.yaml groups by it), listing the flows
  # behind it. Capped at ten: a scan can produce hundreds of flow pairs, and a
  # message nobody can read to the end helps nobody. The same markdown rules
  # as above apply: addresses go in code spans, URLs in <>.
  - orgId: 1
    name: security.message
    template: |
      {{ define "security.message" }}
      {{- /* Severity is derived here from alert_severity, not read from the
      severity label: .CommonLabels drops any label the alerts in a group do
      not share, which left "()" when two instances disagreed. Firing only:
      resolve messages are off, but a notification can still carry resolved
      alerts alongside firing ones, and they listed the same flow twice. */ -}}
      Severity {{ .CommonLabels.alert_severity }} ({{ if eq .CommonLabels.alert_severity "1" }}critical{{ else }}warning{{ end }}) | SID {{ .CommonLabels.alert_signature_id }} | {{ len .Alerts.Firing }} flow(s) in the last 5 minutes
      {{ range $i, $a := .Alerts.Firing }}{{ if lt $i 10 }}
      * `{{ $a.Labels.src_ip }}` to `{{ $a.Labels.dest_ip }}`{{ with $a.Values.B }}, {{ . }} alert(s){{ end }}
      {{ end }}{{ end }}{{ if gt (len .Alerts.Firing) 10 }}
      Showing 10 of {{ len .Alerts.Firing }}; the dashboard has the rest.
      {{ end }}
      dashboard: <{{ .ExternalURL }}d/suricata-alerts/suricata-alerts?var-search={{ .CommonLabels.alert_signature_id }}>
      {{- /* Silences the whole signature. The per-alert SilenceURL matched
      every label, src_ip and dest_ip included, so it muted one flow and the
      next flow of the same signature paged again. */}}
      silence signature: <{{ .ExternalURL }}alerting/silence/new?alertmanager=grafana&matcher=__alert_rule_uid__%3Dsecurity-suricata-alert&matcher=alert_signature_id%3D{{ .CommonLabels.alert_signature_id }}>
      {{ end }}

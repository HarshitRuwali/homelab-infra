apiVersion: 1

# group_by includes `host` so a fleet-wide event (a bad security update
# breaking the same unit everywhere) arrives as one grouped message per
# alertname rather than one message per machine.
policies:
  - orgId: 1
    receiver: matrix-homelab
    group_by: [alertname, host]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      # Critical bypasses the slow grouping and repeats aggressively.
      - receiver: matrix-homelab
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 2h
        continue: false

      # Informational noise is batched and silenced overnight. Warning and
      # critical are never muted.
      - receiver: matrix-homelab
        object_matchers:
          - ['severity', '=', 'info']
        group_wait: 5m
        group_interval: 30m
        repeat_interval: 24h
        mute_time_intervals: [overnight]

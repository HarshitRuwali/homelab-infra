[project]
name = "personal-assistant-fastapi"
version = "0.1.0"
description = "FastAPI middleware for the personal assistant memory and LLM services."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "fastapi[standard]==0.115.5",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.10",
    "pydantic-settings==2.6.1",
    "qdrant-client==1.12.1",
    "sqlalchemy[asyncio]==2.0.36",
    "uvicorn[standard]==0.32.1",
]

[tool.uv]
package = false

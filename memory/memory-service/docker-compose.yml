# Memory services
# Services: Qdrant, PostgreSQL, Redis
# Deploy this on the host or container that stores persistent memory state.
#
# Usage:
#   cp .env.example .env
#   mkdir -p data/qdrant data/postgres data/redis
#   docker compose up -d
#   docker compose logs -f

services:
  qdrant:
    # Qdrant upgrades its storage only one minor release at a time. Before
    # `up -d` on existing data, compare `curl localhost:6333` with the newest
    # release; if it is more than one minor behind, step through the missed
    # minors with ../upgrade-qdrant-stepwise.sh.
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:?QDRANT_HTTP_PORT must be set}:6333"
      - "${QDRANT_GRPC_PORT:?QDRANT_GRPC_PORT must be set}:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT must be set}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c wal_level=replica
        -c synchronous_commit=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:?REDIS_HOST_PORT must be set}:6379"
    volumes:
      - ./data/redis:/data
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 2gb
        --maxmemory-policy allkeys-lru
        --save 3600 1
        --save 300 100
        --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

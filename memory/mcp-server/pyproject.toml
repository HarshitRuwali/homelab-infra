[project]
name = "open-memory-mcp"
version = "0.1.0"
description = "MCP server exposing the Open Memory Stack API as native agent tools."
requires-python = ">=3.10"
dependencies = [
    # Tested against mcp 2.0.0, where FastMCP moved to
    # mcp.server.mcpserver.MCPServer. server.py still falls back to the 1.x
    # FastMCP name, so 1.x installs work too — but the upper bound is real:
    # a future 3.0 could move the entry point again and the fallback would
    # raise ImportError at startup rather than degrade.
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27",
]

[project.scripts]
open-memory-mcp = "open_memory_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_memory_mcp"]

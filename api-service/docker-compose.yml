# FastAPI service
# Runs the Open Memory Stack API.
#
# Pre-requisites:
#   - PostgreSQL, Qdrant, and Redis must be reachable using .env host settings.
#   - LLM and embedding services must be reachable using .env host settings.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d --build

services:
  fastapi:
    build: .
    container_name: fastapi
    restart: unless-stopped
    ports:
      - "${FASTAPI_PORT:?FASTAPI_PORT must be set}:${APP_PORT:?APP_PORT must be set}"
    volumes:
      - ./logs:/app/logs
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${APP_PORT:?APP_PORT must be set}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

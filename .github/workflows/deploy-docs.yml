name: Deploy docs

# Builds the MkDocs site and publishes it to GitHub Pages.
#
# Docs only: it never runs a playbook, never connects to a host, and uses no
# repository secret. Nothing here can reach the fleet.
#
# The Pages site is created by `configure-pages` with `enablement: true`, using
# the `pages: write` permission below. No manual Settings -> Pages step is
# needed. This only works while the repo is public (or on a plan that includes
# Pages for private repos); otherwise enable Pages by hand and drop the flag.

on:
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/deploy-docs.yml
  push:
    branches:
      - master
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      # --strict turns broken internal links and pages missing from the nav
      # into build failures rather than warnings nobody reads.
      - name: Build docs
        run: mkdocs build --strict

      # Creates the Pages site on first run if it does not exist yet. Skipped on
      # pull requests: MkDocs takes its base URL from `site_url` in mkdocs.yml
      # rather than from this action's outputs, nothing is uploaded on a PR, and
      # a fork PR has no `pages: write` to enable anything with.
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4

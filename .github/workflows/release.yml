name: Release

# Versions each module independently with release-please, in manifest mode.
# Every push to master, it reads the Conventional Commits that touched each
# module directory and keeps one release PR open (titled "chore: release
# master") that lists every module with pending changes: the new version, the
# release notes, and the version strings in the module's own files. No
# CHANGELOG.md is written; the notes live on each GitHub release.
# Merging that PR tags each module `<module>-vX.Y.Z` and publishes one GitHub
# release per module.
#
# Settings are in release-please-config.json; the last released version of each
# module is in .release-please-manifest.json. The rules for commit messages and
# the release flow are in CONTRIBUTING.md.
#
# The action is pinned by commit SHA, not by tag, because it runs with write
# access to the repository (contents, issues, pull requests). Bump the SHA by
# hand when moving to a newer release.
#
# PREREQUISITE, one time, cannot be automated:
#   Settings -> Actions -> General -> Workflow permissions ->
#   "Allow GitHub Actions to create and approve pull requests"
# Until it is on, this workflow fails with "GitHub Actions is not permitted to
# create or approve pull requests". `workflow_dispatch` lets you start it by
# hand (Actions tab -> Release -> Run workflow) once the setting is on, instead
# of waiting for the next push to master.
#
# A pull request or tag created with GITHUB_TOKEN does not trigger other
# workflows, so the release PR shows no checks. .github/scripts/release-config-test.sh
# (run by checks.yml on every pull request and on master) is what keeps the
# files the release PR edits consistent.
#
# Releases only: it never runs a playbook, never deploys, never touches a host,
# and uses no repository secret, only the built-in GITHUB_TOKEN.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tags
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

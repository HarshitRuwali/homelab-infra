name: Publish docs

# The only workflow in this repository, and it does exactly one thing: build
# the MkDocs site and publish it to GitHub Pages.
#
# It never runs a playbook, never connects to a host, and uses no repository
# secret. Nothing here can reach the fleet.
#
# To build the same site locally:
#   uv run --group docs mkdocs serve    # preview on :8000
#   uv run --group docs mkdocs build    # render into site/

on:
  push:
    branches: [master]
    # Only when something that affects the rendered site changes. Editing a
    # playbook or a dashboard does not republish the docs.
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  # Republish by hand from the Actions tab without an empty commit.
  workflow_dispatch:

# One publish at a time, and never cancel one in flight: a half-finished Pages
# deploy leaves the published site broken.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege. `contents: read` to check out; the other two are what
# actions/deploy-pages needs to upload and claim the deployment. Deliberately
# no `contents: write`: this workflow cannot push to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # =====================================================================
  # Everything that must be true before anything reaches the internet.
  # Separate from `build` so a failure is obvious rather than buried in a
  # longer log.
  # =====================================================================
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `enablement: true` turns Pages on via the API if it is not already
      # configured, so a fresh clone of this repo publishes without anyone
      # visiting Settings first.
      #
      # This exists because the first run DID fail here: the Verify job passed
      # every check, then `deploy-pages` failed with a message that does not
      # say what is wrong. `GET /repos/<owner>/<repo>/pages` returned 404,
      # meaning Pages had simply never been enabled.
      #
      # If this step fails with "Resource not accessible by integration", the
      # token is not allowed to enable Pages. Enable it once by hand instead:
      #   Settings -> Pages -> Source: GitHub Actions
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # --strict promotes broken internal links and pages missing from the
      # nav into build failures rather than warnings nobody reads.
      #
      # --frozen fails if uv.lock is out of date with pyproject.toml instead
      # of silently resolving something newer, so the published site is built
      # from exactly the pinned versions.
      - name: Build with strict mode
        run: uv run --frozen --group docs --no-default-groups mkdocs build --strict

      # --strict validates page-to-page links but NOT the `#anchor` part, so a
      # link to a renamed heading builds clean and 404s in the browser.
      - name: Cross-page heading anchors resolve
        run: |
          python3 - <<'PY'
          import os, re, glob, sys

          heads = {}
          for p in glob.glob('docs/**/*.md', recursive=True):
              key = os.path.relpath(p, 'docs')
              heads[key] = set()
              for line in open(p, encoding='utf-8'):
                  m = re.match(r'^#{1,6}\s+(.*?)\s*$', line)
                  if m:
                      slug = re.sub(r'[^\w\s-]', '', m.group(1).lower()).strip().replace(' ', '-')
                      heads[key].add(slug)

          rc = 0
          for p in glob.glob('docs/**/*.md', recursive=True):
              d = os.path.dirname(os.path.relpath(p, 'docs'))
              for m in re.finditer(r'\]\(([^)#]*?\.md)#([^)]+)\)',
                                   open(p, encoding='utf-8').read()):
                  target = os.path.normpath(os.path.join(d, m.group(1)))
                  if target in heads and m.group(2) not in heads[target]:
                      print(f"::error file={p}::dead anchor {m.group(1)}#{m.group(2)}")
                      rc = 1
          print('all cross-page anchors resolve' if not rc else '')
          sys.exit(rc)
          PY

      # ---------------------------------------------------------------
      # This repository is public, so the published site is public. The docs
      # are the easiest place for a real address to end up, because examples
      # get pasted from a working terminal.
      #
      # Scans the RENDERED site, not just the sources, so a real address that
      # arrives via a snippet or an include is still caught.
      #
      # Allowed placeholders: example.com, RFC 5737 TEST-NET-1 (192.0.2.0/24),
      # generic 10.0.x used by hosts.example.yml, and the two documented
      # Tailscale examples 100.64.0.11 and .12.
      # ---------------------------------------------------------------
      - name: No site-specific data in the rendered site
        run: |
          fail=0
          scan() {
            if hits=$(grep -rnaE "$1" site/ docs/ README.md 2>/dev/null \
                      | { [ -n "$2" ] && grep -vE "$2" || cat; }); then
              if [ -n "$hits" ]; then
                echo "::error::$3"
                printf '%s\n' "$hits" | head -5
                fail=1
              fi
            fi
          }
          scan 'sp00fexpl01t' '' \
               'The real monitoring domain would be published'
          scan '\b10\.10\.[0-9]{1,3}\.[0-9]{1,3}\b' '' \
               'A private LAN address would be published'
          scan '\b100\.(6[4-9]|[7-9][0-9]|1[0-1][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b' \
               '100\.64\.0\.(11|12)\b' \
               'A tailnet address would be published'
          [ "$fail" = 0 ] && echo "no domain, LAN address or tailnet address"
          exit $fail

      # House style from the repo owner. Cheap here, tedious by hand.
      - name: No em dashes
        run: |
          if grep -rn -- '—' docs/ README.md mkdocs.yml 2>/dev/null; then
            echo "::error::em dash found. Use commas, colons, periods or parentheses."
            exit 1
          fi
          echo "no em dashes"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # =====================================================================
  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: aibox-model-queue
version: 0.2.0  # x-release-please-version
description: "Proxy in front of the AI box's llama.cpp llama-server (default :8090). Serializes requests for different models (a no-op with one resident model), cleans tool schemas the grammar compiler rejects, and translates the Hermes reasoning off-switch. A model fallback is deliberately not used: it would silently answer on a weaker model."
author: harshit
kind: standalone

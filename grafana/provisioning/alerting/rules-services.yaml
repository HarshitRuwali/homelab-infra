apiVersion: 1

groups:
  - orgId: 1
    name: services
    folder: Fleet
    interval: 1m
    rules:

      # ---------------------------------------------------------------
      - uid: fleet-systemd-unit-failed
        title: Systemd Unit Failed
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A systemd unit is in the failed state.
          runbook: "systemctl --failed; journalctl -u <unit> -n 100"
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              # `by (host, name)` keeps the unit name in the alert instance so
              # the Matrix message says WHICH unit, not just which host.
              # The exclusions are units that routinely fail harmlessly.
              expr: |
                max by (host, name) (
                  node_systemd_unit_state{state="failed",name!~"(systemd-.*|user@.*|.*-cleanup)\\.service"} == 1
                )
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}

      # ---------------------------------------------------------------
      - uid: fleet-unattended-upgrades-errors
        title: Unattended Upgrades Errors
        condition: C
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: unattended-upgrades logged errors in the last hour.
          runbook: 'Loki: {unit="unattended-upgrades.service"} |~ "(?i)(traceback|error)"'
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            # This one queries Loki, not Prometheus. Grafana-managed alerting
            # handles a Loki datasource with the same A/B/C shape. Only
            # possible because Unattended-Upgrade::SyslogEnable "true" puts
            # every action in the journal, which Alloy already ships.
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: |
                sum by (host) (
                  count_over_time({unit="unattended-upgrades.service"} |~ `(?i)(traceback|^E: |error|could not|failed to)` [1h])
                )
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}

# Media stack: Plex, and qBittorrent behind a ProtonVPN WireGuard tunnel.
#
# Deployed by ./install.sh into MEDIA_DIR (default /opt/media) on the
# cloud-services VM. Every value that differs per host lives in .env, so this
# file is copied as is. Secrets live in MEDIA_DIR/secrets, root-only, and are
# never part of this repository.
#
# Every image follows :latest. The fleet's nightly container updater
# (ansible/roles/docker_updates) pulls them and recreates what changed.
#
# Exposure, by design:
#   plex           host network, :32400. Remote access goes through the
#                  plex-tunnel container (Cloudflare), not a router port.
#   qbittorrent    no port on the host except 127.0.0.1:${QBT_WEBUI_PORT}.
#                  install.sh puts that on the tailnet with `tailscale serve`.
#                  All torrent traffic leaves through gluetun; if the tunnel
#                  drops, gluetun's firewall blocks it rather than leaking.

# Limits and logs. Every service has a memory cap (`mem_limit`, honoured by
# Docker Compose v2 and later) and size-capped json-file logs through the
# x-logging anchor. The host has no swap, so an uncapped container can take RAM
# from its neighbours (Immich, Nextcloud). Caps are sized from 7-day peaks with
# headroom and can be raised per host in .env (see .env.example). New services
# must set both; tests/compose-test.sh fails if one does not.
#
# Transcoding: the VM has no /dev/dri, so Plex cannot use hardware transcoding
# and a transcode runs in software on the VM's vCPUs. Plex's nightly maintenance
# (Butler: library scan, analysis, thumbnails) runs 02:00 to 05:00 IST and uses
# about one core; that is expected, not a fault.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: media

services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: host
    restart: unless-stopped
    mem_limit: ${PLEX_MEM_LIMIT:-1536m}
    logging: *default-logging
    environment:
      TZ: ${TZ}
      PLEX_UID: ${MEDIA_UID}
      PLEX_GID: ${MEDIA_GID}
    volumes:
      - ${MEDIA_DIR}/config/plex:/config
      - ${MEDIA_DIR}/transcode:/transcode
      # Mounted at the path the libraries were created with, so moving
      # hosts needs no rescan and keeps watch history.
      - ${MEDIA_ROOT}:/data/share:ro

  plex-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: plex-tunnel
    # Host network so the tunnel's remote-managed ingress
    # (http://localhost:32400) reaches Plex unchanged.
    network_mode: host
    restart: unless-stopped
    mem_limit: ${PLEX_TUNNEL_MEM_LIMIT:-128m}
    logging: *default-logging
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - ${MEDIA_DIR}/secrets/plex-tunnel.env   # TUNNEL_TOKEN=...
    environment:
      # Host network: the metrics endpoint would otherwise bind 0.0.0.0:20241
      # on the host. Loopback only, and it is what `tunnel ready` queries.
      TUNNEL_METRICS: 127.0.0.1:${PLEX_TUNNEL_METRICS_PORT:-20241}
    healthcheck:
      # The image is distroless: no shell or curl, so use cloudflared itself.
      # Ready means at least one connection to the Cloudflare edge is up.
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    mem_limit: ${GLUETUN_MEM_LIMIT:-192m}
    logging: *default-logging
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      # Read from /run/secrets/wireguard_private_key (the secret below).
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/wireguard_private_key
      # Proton NAT-PMP port forwarding; P2P servers only.
      VPN_PORT_FORWARDING: "on"
      PORT_FORWARD_ONLY: "on"
      # Tell qBittorrent the forwarded port and bind it to the tunnel
      # interface. qBittorrent shares this network namespace, so 127.0.0.1
      # is qBittorrent itself, and it must allow localhost without a login
      # (WebUI\LocalHostAuth=false, which install.sh seeds on a fresh install).
      # See docs/security.md for who else can reach 127.0.0.1 here.
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- --retry-connrefused --post-data
        "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:${QBT_WEBUI_PORT}/api/v2/app/setPreferences 2>&1'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O- --retry-connrefused --post-data
        "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:${QBT_WEBUI_PORT}/api/v2/app/setPreferences 2>&1'
    secrets:
      - wireguard_private_key
    ports:
      # qBittorrent's WebUI, loopback only. See install.sh for the tailnet.
      - "127.0.0.1:${QBT_WEBUI_PORT}:${QBT_WEBUI_PORT}"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # No network of its own: every packet goes through gluetun.
    network_mode: service:gluetun
    restart: unless-stopped
    mem_limit: ${QBT_MEM_LIMIT:-512m}
    logging: *default-logging
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      # Runs in gluetun's namespace, so 127.0.0.1 is qBittorrent's WebUI. The
      # login page needs no authentication, unlike /api.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:${QBT_WEBUI_PORT}/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      TZ: ${TZ}
      PUID: ${MEDIA_UID}
      PGID: ${MEDIA_GID}
      WEBUI_PORT: ${QBT_WEBUI_PORT}
    volumes:
      - ${MEDIA_DIR}/config/qbittorrent:/config
      - ${MEDIA_ROOT}/Torrent:/data/share/Torrent

secrets:
  wireguard_private_key:
    file: ${MEDIA_DIR}/secrets/wireguard_private_key

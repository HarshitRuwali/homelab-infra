[project]
name = "monitorting-stack"
version = "0.1.0"
description = "Central Grafana, Prometheus and Loki for a Proxmox and Tailscale homelab"
readme = "README.md"
requires-python = ">=3.11"

# This project ships no Python package. Everything here is tooling: the
# monitoring stack itself is Grafana, Prometheus, Loki, Alloy and Ansible.
# The docs group below exists so `uv sync` reproduces the exact versions used
# to build the documentation site.
dependencies = []

# PEP 735 dependency group. Install it with:
#   uv sync --group docs
#   uv run --group docs mkdocs serve
[dependency-groups]

# Documentation site.
#
# Pinned so a laptop and a fresh clone render identically. MkDocs is held at
# 1.x deliberately: MkDocs 2.0 removes the plugin system and rewrites theming
# with no migration path, which would break mkdocs-material outright.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.5.49",
    "pymdown-extensions==10.14",
]

[tool.uv]
# `uv sync` with no arguments installs nothing beyond the (empty) project
# dependencies. Ask for the docs group explicitly:
#   uv sync --group docs
default-groups = []

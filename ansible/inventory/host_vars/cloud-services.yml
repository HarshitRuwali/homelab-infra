---
# Bound journal growth so backup staging retains space on the VM's 40 GB disk.
journald_system_max_use: 128M

# The media stack (homelab-infra media/) follows :latest and is updated nightly
# like every other project. The updater runs `up -d` on the whole project, so
# both media secrets must stay in place; to remove one, put `media` in
# docker_update_skip_projects here first (media/docs/operations.md).

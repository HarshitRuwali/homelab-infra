---
# ubuntu-dev, the workstation and the jump host for the lan_guests group.

# Per-process metrics, for the "Host Processes" dashboard.
#
# Opt-in per host rather than a fleet default, and this file is what makes it
# stick: enabling it with `-e alloy_enable_process=true` on the command line
# lasts exactly one run, and the NEXT collectors.yml pass would re-render the
# config without the block and silently drop the metrics.
#
# Enabled here because this is the box whose processes anyone actually looks
# at. It costs ~1000 series (measured: 47 process groups, 1072 series) against
# a fleet head of ~52k, so turning it on everywhere would be roughly a 20%
# increase for hosts whose process list never changes. See
# roles/alloy_collector/defaults/main.yml.
alloy_enable_process: true

# Projects the nightly updater must leave alone here; see the 2026-09-14
# deployment log.
#
# fastapi-lxc: started from a compose file that no longer exists (the project
#   became api-service and its folder was deleted), so every run failed on it.
#   Its image is built locally, so there was never anything to pull. Remove
#   once the container is retired or redeployed from api-service.
# superset: its websocket host port comes from WEBSOCKET_PORT in the shell
#   that ran `up` (the project's .envrc.example picks the first free port from
#   8080), which the systemd updater never has. Compose then falls back to
#   8080, calls the websocket service changed, recreates it, and the bind fails
#   because fastapi holds 8080. It runs on 8082 now; remove this once
#   WEBSOCKET_PORT=8082 is pinned in the project's .env.
docker_update_skip_projects:
  - fastapi-lxc
  - superset

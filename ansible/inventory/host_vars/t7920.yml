---
# t7920, the Proxmox hypervisor: a Dell Precision 7920 Tower.
#
# Platform-wide bare-metal settings (SMART, PVE cardinality, patching) live in
# group_vars/metal. This file holds what is true of this one Dell machine and
# would not be of another bare-metal host.

# Every chassis fan by name. dell_smm_hwmon only exposes four of the twelve
# this firmware reports; see roles/dell_fan_metrics.
dell_fan_metrics_enabled: true

# Run the CPU1 fan at full speed while CPU1's package is hot, and give every
# fan back to the firmware once it cools. The firmware's own curve holds it
# near 1000 RPM with the package at 65 to 71 C; see roles/dell_fan_boost.
dell_fan_boost_enabled: true

# What the datacenter firewall dropped, with the rule and the guest, in Loki.
# Needs the alloy user in the adm group (it is: pve-firewall.log is root:adm 640).
alloy_pve_firewall_log: true

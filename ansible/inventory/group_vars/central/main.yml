---
# The central stack pushes to itself over loopback. It must NOT go out through
# Cloudflare and back in: that would make its own telemetry depend on the WAN
# being up, which is exactly when you most need it.
prometheus_remote_write_url: http://127.0.0.1:9090/api/v1/write
loki_write_url: http://127.0.0.1:3100/loki/api/v1/push

# nginx on this box terminates the basic auth for everyone else, so the local
# push does not present credentials at all.
collector_basic_auth_required: false

alloy_enable_docker: false

# The one host that listens for syslog: the firewall's Suricata EVE output
# lands here and is forwarded to Loki as job="suricata". See
# roles/alloy_collector/defaults/main.yml for why the port is not 1514.
alloy_syslog_listener_port: 5514

# The central LXC usually sits on the same private LAN as the other Proxmox
# guests, so a controller outside that network needs the same ProxyJump the
# lan_guests group uses. Set `lan_use_jump_host: false` when running from a
# controller already on the LAN, exactly as for lan_guests.
ansible_ssh_common_args: >-
  {% if lan_use_jump_host | default(true) | bool %}
  -o ProxyJump={{ hostvars[lan_jump_host].ansible_user }}@{{ hostvars[lan_jump_host].ansible_host }}
  {% endif %}
  -o StrictHostKeyChecking=accept-new

# --- Patching ------------------------------------------------------------
# This host DOES auto-apply security updates, but never to the monitoring
# stack itself. Those five packages are upgraded deliberately by
# `scripts/lxc-update.sh central`, which re-renders their configs in the same
# run. Letting unattended-upgrades bump them instead would:
#   - restart grafana/prometheus/loki, blinding the fleet at 03:00
#   - reload nginx, briefly 502-ing every collector's ingest path
#   - upgrade a package whose config file this repo owns, without
#     re-rendering that config
#
# So: OS and security patches here, stack upgrades stay a supervised action.
# Nothing held back here by policy either. Consequence to be aware of: a
# grafana/loki/prometheus/nginx upgrade restarts those services, so the
# monitoring itself has a brief gap and collectors may see a short 502 on the
# ingest path. Their configs are still owned by scripts/lxc-update.sh, so
# after a package upgrade changes a config format, re-run:
#   scripts/lxc-update.sh central --config-only
uu_package_blacklist: []

# Losing the kernel this box booted from is not worth the disk saving.
uu_remove_unused_kernels: false

# filterlog volume that is not worth storing, dropped only for lines on the WAN
# interface (alloy_syslog_drop_filterlog_iface, vtnet0 by default). A label is
# OPNsense's own automatic rule, so it is the same on every install of the same
# release; check one with `pfctl -sr -v | grep <label>` on the firewall before
# reusing it.
#
# 02f4bab031b57d1e30553ce08e0ec131 is the default deny, `block drop in log inet
# all`. It is interface-agnostic (pfctl shows it with no `on <interface>`), so
# every interface can fire it. On the WAN side it is home LAN broadcast and
# discovery, which carries no decision, so it is dropped there. On the lease and
# tenant interfaces it shows out-of-state TCP and other default-denied traffic,
# so it is kept there.
#
# 6125cb207f65033775d1069fdf6d0ccf, "let out anything from the firewall host
# itself", is NOT listed, on purpose. Its pf rule is `pass out log route-to
# (vtnet0 10.10.0.1) inet from (vtnet0) to ! (vtnet0:network)`, which looks like
# the firewall's own traffic (Unbound lookups, NTP). But pf translates NAT before
# it filters an outgoing packet, so the OUTBOUND LEG OF EVERY TENANT AND LEASE
# FLOW (source = the firewall's WAN address, with the translated source port) is
# logged under this label too: 6 of 7 filter-log lines for a destination only a
# test lease contacted carried it. That line is what matches an abuse report
# (public IP, translated port, destination, time) to a VM, so it must reach Loki.
# Keeping it costs about 1.5 lines a second. Do not add it to this list.
alloy_syslog_drop_filterlog_rules:
  - 02f4bab031b57d1e30553ce08e0ec131   # the default deny, `block drop in log inet all`: dropped on the WAN side only

# OPNsense's automatic "block <virusprot> hosts" rule. A source that exceeds a
# per-source connection limit is banned for up to an hour and this rule logs
# every packet it sends meanwhile. Rate-limited here so a ban cannot flood Loki.
alloy_syslog_ratelimit_filterlog_rules:
  - add09fc915886757c300419fc2ecc1e6


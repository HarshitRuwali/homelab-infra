---
# DISTRO-level overrides for Raspberry Pi OS (Debian) on the Pis.
#
# This is the packaging half of the Pi configuration; the hardware half is in
# group_vars/pi. The split is not academic: every value here names an apt
# package, so a hypothetical `pi_fedora` sibling would need entirely
# different holds while still wanting the SD-card IO tuning next door.
#
# The kernel/bootloader blacklist is the important part. On Raspberry Pi OS
# the kernel, its modules, and the /boot/firmware payload are updated by
# separate packages. Applying those without the reboot that this fleet policy
# forbids is the classic way to end up with a running kernel whose modules are
# no longer on disk.

# The ONLY packages held back anywhere in the fleet.
#
# raspberrypi-kernel and raspberrypi-bootloader are UNVERSIONED: upgrading
# them overwrites /boot/firmware and /lib/modules/$(uname -r) in place rather
# than installing alongside. Under this fleet's never-auto-reboot policy that
# leaves the running kernel with no modules on disk, so anything not already
# loaded (USB storage, a filesystem, a netfilter module) fails until reboot.
#
# Remove these only if you are also prepared to reboot the Pi immediately.
uu_package_blacklist:
  - "raspberrypi-kernel"
  - "raspberrypi-bootloader"
  - "linux-image-rpi-.*"

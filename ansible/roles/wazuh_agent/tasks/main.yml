---
# This role is applied by GROUP MEMBERSHIP (`wazuh_agents`), never by an
# in-role `when:`, for the same reason unattended_upgrades is: a conditional
# here would be one typo away from enrolling the hypervisor or the firewall
# by accident. See inventory/hosts.example.yml.
#
# The manager itself is provisioned separately, by security/. This role only
# puts agents on hosts and points them at it.

- name: Require a manager address
  ansible.builtin.assert:
    that:
      - wazuh_manager_address | length > 0
      - wazuh_manager_inventory_host | length > 0
      - wazuh_manager_ca_src | length > 0
      - wazuh_agent_group is match('^[A-Za-z0-9_-]+$')
    fail_msg: >-
      Set wazuh_manager_address, wazuh_manager_ca_src and the wazuh_manager
      inventory group in your private inventory. Use a valid wazuh_agent_group.
    quiet: true

- name: Require an enrollment secret from the vault
  ansible.builtin.assert:
    that:
      - wazuh_enrollment_password | length >= 20
      - not (wazuh_enrollment_password is search('\s'))
    fail_msg: Set vault_wazuh_enrollment_password to the manager's enrollment password.
    quiet: true
  no_log: true

- name: Verify the requested group exists on the manager before installing agents
  ansible.builtin.stat:
    path: "/var/ossec/etc/shared/{{ wazuh_agent_group }}"
  delegate_to: "{{ wazuh_manager_inventory_host }}"
  register: wazuh_manager_group

- name: Require the manager enrollment group
  ansible.builtin.assert:
    that:
      - wazuh_manager_group.stat.isdir | default(false)
    fail_msg: >-
      Run security/install/configure-sec-wazuh.sh on the manager first,
      with WAZUH_AGENT_GROUP matching wazuh_agent_group.

- name: Add the Wazuh APT repository
  ansible.builtin.import_tasks: repo.yml

- name: Install the agent
  ansible.builtin.apt:
    name: wazuh-agent
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the trusted manager CA
  ansible.builtin.copy:
    src: "{{ wazuh_manager_ca_src }}"
    dest: "{{ wazuh_manager_ca_path }}"
    owner: root
    group: wazuh
    mode: "0640"
  notify: Restart wazuh-agent

- name: Install the enrollment password without logging its contents
  ansible.builtin.copy:
    content: "{{ wazuh_enrollment_password }}\n"
    dest: "{{ wazuh_enrollment_password_path }}"
    owner: root
    group: wazuh
    mode: "0640"
  no_log: true
  notify: Restart wazuh-agent

- name: Configure the agent
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: "0640"
  notify: Restart wazuh-agent

# Held so an apt upgrade cannot move an agent past the manager's major
# version. Unpin deliberately when upgrading the manager, not incidentally.
- name: Hold the agent at its installed version
  ansible.builtin.dpkg_selections:
    name: wazuh-agent
    selection: hold

- name: Enable and start the agent
  ansible.builtin.systemd:
    name: wazuh-agent
    enabled: true
    state: started
    daemon_reload: true

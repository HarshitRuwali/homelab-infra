---
# Runs first, on every tag (tag: always), before anything is installed,
# upgraded or restarted. This role must never touch the tailnet router (the
# exit node and subnet router): restarting tailscaled there drops the estate's
# routed traffic, and a package upgrade restarts it. Group membership is the
# control; these checks are the backstops, and they run even with --tags serve.

- name: Refuse the tailnet router by name
  ansible.builtin.assert:
    that:
      - inventory_hostname != 'tailscale-router'
    fail_msg: >-
      {{ inventory_hostname }} is the tailnet router (exit node and subnet
      router). tailscale_node never manages it, because restarting tailscaled
      there drops the estate's routed traffic. Remove it from tailscale_nodes.
    quiet: true

# apt_repository and apt need python3-apt. A real run installs it on its own;
# --check cannot, so on a bare host a dry run would fail at the first apt task
# with a message that does not say why.
- name: Look for python3-apt
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['python']['executable'] }}"
      - -c
      - import apt_pkg
  register: tailscale_node_python_apt
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check python3-apt is available to a dry run
  ansible.builtin.assert:
    that:
      - tailscale_node_python_apt.rc == 0 or not ansible_check_mode
    fail_msg: >-
      python3-apt is not installed on {{ inventory_hostname }}, and --check
      cannot install it. Run once without --check (the apt module installs it),
      or install python3-apt, then dry-run again.
    quiet: true

# The prefs hold what the node is configured to advertise, whether or not the
# routes are approved yet. That is why this reads them as well as the status:
# a router that is logged out or stopped shows no approved routes in status.
# `tailscale debug` is not a stable interface; if it does not answer (no
# tailscale yet, or tailscaled down) the prefs check is skipped.
- name: Read the node's advertised routes
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_node_prefs_raw
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the tailnet state
  ansible.builtin.import_tasks: state.yml

- name: Record the advertised routes
  ansible.builtin.set_fact:
    tailscale_node_advertised_routes: >-
      {{ ((tailscale_node_prefs_raw.stdout | from_json).AdvertiseRoutes | default([], true))
         if (tailscale_node_prefs_raw.rc | default(1)) == 0
            and (tailscale_node_prefs_raw.stdout | default('')) is match('\s*\{')
         else [] }}

- name: Refuse a node that advertises routes or is an exit node
  ansible.builtin.assert:
    that:
      - tailscale_node_advertised_routes | length == 0
      - not (tailscale_node_self.ExitNodeOption | default(false))
    fail_msg: >-
      {{ inventory_hostname }} advertises subnet routes
      ({{ tailscale_node_advertised_routes }}) or is an exit node (tailscale
      debug prefs or tailscale status say so). tailscale_node never manages the
      tailnet router. Remove the host from tailscale_nodes.
    quiet: true

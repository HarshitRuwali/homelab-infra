---
- name: Restart prometheus-network
  ansible.builtin.systemd:
    name: prometheus-network.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

# Datasource provisioning is read at startup. Restarting Grafana pauses alert
# evaluation briefly, the same trade roles/grafana_alerting makes.
- name: Restart grafana-server
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Reload systemd for net-history
  ansible.builtin.systemd:
    daemon_reload: true
  when: not ansible_check_mode

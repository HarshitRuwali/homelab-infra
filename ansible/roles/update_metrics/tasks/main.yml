---
- name: Install needrestart for kernel/service staleness detection
  ansible.builtin.apt:
    name: needrestart
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: update_metrics_use_needrestart | bool

# needrestart's own APT hook prompts interactively during upgrades, which
# would hang an unattended run. We only want its reporting mode.
- name: Put needrestart in non-interactive list mode
  ansible.builtin.copy:
    content: |
      # Managed by ansible/roles/update_metrics.
      # List outdated services, never prompt: an interactive prompt would
      # hang unattended-upgrades indefinitely.
      $nrconf{restart} = 'l';
    dest: /etc/needrestart/conf.d/50-fleet-noninteractive.conf
    owner: root
    group: root
    mode: "0644"
  when: update_metrics_use_needrestart | bool

- name: Ensure the textfile collector directory exists
  ansible.builtin.file:
    path: "{{ update_metrics_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the update-metrics exporter script
  ansible.builtin.template:
    src: fleet-update-metrics.sh.j2
    dest: "{{ update_metrics_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: run fleet-update-metrics

- name: Install the update-metrics systemd service
  ansible.builtin.template:
    src: fleet-update-metrics.service.j2
    dest: /etc/systemd/system/fleet-update-metrics.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - run fleet-update-metrics

- name: Install the update-metrics systemd timer
  ansible.builtin.template:
    src: fleet-update-metrics.timer.j2
    dest: /etc/systemd/system/fleet-update-metrics.timer
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Enable and start the update-metrics timer
  ansible.builtin.systemd:
    name: fleet-update-metrics.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers so metrics exist before we verify them
  ansible.builtin.meta: flush_handlers

# --- Proof of life -------------------------------------------------------
- name: Confirm the metrics file was written
  ansible.builtin.stat:
    path: "{{ update_metrics_dir }}/{{ update_metrics_file }}"
  register: update_metrics_out

- name: Fail if the exporter produced nothing
  ansible.builtin.assert:
    that:
      - update_metrics_out.stat.exists
      - update_metrics_out.stat.size > 0
    fail_msg: >-
      {{ update_metrics_script }} did not produce
      {{ update_metrics_dir }}/{{ update_metrics_file }}.
      Check: journalctl -u fleet-update-metrics.service -n 50

[defaults]
inventory            = inventory/hosts.local.yml
roles_path           = roles
host_key_checking    = True
interpreter_python   = auto_silent
# community.general.yaml was removed in ansible-core 2.13+; the built-in
# default callback with result_format=yaml replaces it.
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = ansible.posix.profile_tasks, ansible.builtin.timer
retry_files_enabled  = False
forks                = 7
vault_password_file  = ~/.config/ansible/monitorting-vault-pass

[ssh_connection]
pipelining  = True
ssh_args    = -C -o ControlMaster=auto -o ControlPersist=120s

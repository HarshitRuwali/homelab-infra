[defaults]
inventory            = inventory/hosts.local.yml
roles_path           = roles
host_key_checking    = True
interpreter_python   = auto_silent
# community.general.yaml was removed in ansible-core 2.13+; the built-in
# default callback with result_format=yaml replaces it.
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = ansible.posix.profile_tasks, ansible.builtin.timer
retry_files_enabled  = False
forks                = 7
vault_password_file  = ~/.config/ansible/monitorting-vault-pass

[ssh_connection]
pipelining  = True
# IdentitiesOnly=yes is load-bearing: without it SSH offers every key in the
# agent and in ~/.ssh, and a host with a low MaxAuthTries disconnects before
# reaching the right one. That fails as "Permission denied (publickey)",
# which is indistinguishable from genuinely lacking access and will send you
# chasing an authorisation problem that does not exist.
ssh_args    = -C -o ControlMaster=auto -o ControlPersist=120s -o IdentitiesOnly=yes

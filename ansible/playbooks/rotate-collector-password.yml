---
# Rotate the shared collector basic-auth password.
#
# Why rotate rather than recover: the current password exists only on the
# central LXC (plaintext in /etc/default/alloy, bcrypt in the nginx htpasswd)
# and is not in the vault. Rotating makes the vault authoritative. Right now
# that costs nothing because NOTHING in the fleet pushes yet, so run this
# before the collector rollout, not after.
#
#   ansible-playbook playbooks/rotate-collector-password.yml
#
# Ordering matters and is why all of this is a single play: between rewriting
# the htpasswd and restarting the central Alloy, the central collector's own
# pushes get 401. That window is seconds and Alloy's WAL replays through it,
# but do not split these steps across two runs.

- name: Rotate the collector password on the central stack
  hosts: central
  become: true
  vars:
    htpasswd_file: /etc/nginx/monitoring-collectors.htpasswd

  tasks:
    - name: Refuse to run against a placeholder password
      ansible.builtin.assert:
        that:
          - vault_collector_basic_auth_password | length >= 20
          - not (vault_collector_basic_auth_password is search('REPLACE_ME'))
        fail_msg: "Set a real vault_collector_basic_auth_password first."

    - name: Ensure htpasswd tooling is available
      ansible.builtin.apt:
        name: apache2-utils
        state: present

    - name: Back up the current htpasswd
      ansible.builtin.copy:
        src: "{{ htpasswd_file }}"
        dest: "{{ htpasswd_file }}.bak"
        remote_src: true
        owner: root
        mode: "0640"
      failed_when: false

    - name: Write the new htpasswd entry
      ansible.builtin.command:
        argv:
          - htpasswd
          - -bB
          - "{{ htpasswd_file }}"
          - "{{ collector_basic_auth_user }}"
          - "{{ vault_collector_basic_auth_password }}"
      no_log: true
      changed_when: true

    - name: Fix htpasswd ownership
      ansible.builtin.file:
        path: "{{ htpasswd_file }}"
        owner: root
        group: www-data
        mode: "0640"

    - name: Validate the nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    # Keeps the server-side .env in step, so a later `lxc-update.sh central`
    # does not quietly revert the password back to the old value.
    - name: Update the collector password in the server-side .env
      ansible.builtin.lineinfile:
        # The checkout lives at /root/monitorting-stack on the central LXC.
        # Overridable in case it moves.
        path: "{{ central_repo_path | default('/root/monitorting-stack') }}/.env"
        regexp: '^COLLECTOR_BASIC_AUTH_PASSWORD='
        line: 'COLLECTOR_BASIC_AUTH_PASSWORD={{ vault_collector_basic_auth_password }}'
      no_log: true
      failed_when: false

    - name: Update the central collector's own credentials
      ansible.builtin.lineinfile:
        path: /etc/default/alloy
        regexp: '^COLLECTOR_BASIC_AUTH_PASSWORD='
        line: 'COLLECTOR_BASIC_AUTH_PASSWORD="{{ vault_collector_basic_auth_password }}"'
      no_log: true

    - name: Restart the central collector so it picks up the new password
      ansible.builtin.systemd:
        name: alloy
        state: restarted

    # NOT /loki/ready: nginx preserves the /loki prefix (proxy_pass has no
    # URI part), so that resolves to :3100/loki/ready and 404s. Loki's API is
    # already namespaced under /loki/api/v1/, so this path maps straight through.
    - name: Confirm the new password is accepted at the ingest path
      ansible.builtin.uri:
        url: "https://{{ monitoring_domain }}/loki/api/v1/labels"
        user: "{{ collector_basic_auth_user }}"
        password: "{{ vault_collector_basic_auth_password }}"
        force_basic_auth: true
        status_code: [200]
      delegate_to: localhost
      become: false
      no_log: true
      retries: 5
      delay: 5
      register: rot_check
      until: rot_check is succeeded

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Collector password rotated and verified. Every collector must now be
          re-run to pick it up:
          ansible-playbook playbooks/collectors.yml

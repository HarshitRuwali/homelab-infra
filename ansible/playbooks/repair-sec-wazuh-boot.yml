---
# Repair boot-time cloud-init/man-db failures after the Wazuh VM ran out of
# space. Proxmox provisions ciuser=admin; Debian's fallback cloud-init user is
# debian, which is absent on this VM and breaks ssh-authkey-fingerprints.
- name: Repair sec-wazuh boot services
  hosts: sec-wazuh
  become: true
  tasks:
    - name: Keep cloud-init's fallback user aligned with Proxmox
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-fleet-default-user.cfg
        owner: root
        group: root
        mode: "0644"
        content: |
          system_info:
            default_user:
              name: admin

    - name: Rebuild the man page index now that disk space is available
      ansible.builtin.systemd:
        name: man-db.service
        state: started

    - name: Clear historical cloud-init failures from the boot with full disk
      ansible.builtin.command:
        cmd: >-
          systemctl reset-failed
          cloud-config.service cloud-final.service cloud-init-local.service
          cloud-init-main.service cloud-init-network.service
      changed_when: true

    - name: Check failed units
      ansible.builtin.command: systemctl --failed --no-legend
      register: failed_units
      changed_when: false

    - name: Verify no failed units remain
      ansible.builtin.assert:
        that: failed_units.stdout | trim == ""
